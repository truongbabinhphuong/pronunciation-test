<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pronunciation Competition - Teacher tool for analyzing student pronunciation">
    <title>Pronunciation Competition</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Pronunciation Competition</h1>
            <button 
                id="settingsBtn" 
                class="bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-white transition"
                aria-label="Open settings">
                ⚙️ Settings
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <!-- Target Word Section -->
        <section class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Target Word Configuration</h2>
            <div class="grid gap-4">
                <div>
                    <label for="targetWord" class="block text-sm font-medium text-gray-700 mb-1">
                        Target Word *
                    </label>
                    <input 
                        type="text" 
                        id="targetWord" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="e.g., through"
                        aria-required="true">
                </div>
                <div>
                    <label for="expectedIPA" class="block text-sm font-medium text-gray-700 mb-1">
                        Expected IPA (optional)
                    </label>
                    <div class="flex gap-2">
                        <input 
                            type="text" 
                            id="expectedIPA" 
                            class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="e.g., θruː">
                        <button 
                            id="lookupIPABtn" 
                            class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500 transition"
                            aria-label="Lookup IPA from Gemini">
                            🔍 Lookup IPA
                        </button>
                    </div>
                </div>
                <button 
                    id="setWordBtn" 
                    class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition font-semibold">
                    Set Word
                </button>
            </div>
            <div id="currentWordDisplay" class="mt-4 p-3 bg-blue-50 rounded hidden">
                <p class="text-sm text-gray-600">Current word: <span id="currentWord" class="font-bold text-blue-700"></span></p>
                <p class="text-sm text-gray-600" id="currentIPADisplay"></p>
            </div>
        </section>

        <!-- Recording Controls -->
        <section class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Recording Controls</h2>
            <div class="flex flex-wrap gap-4">
                <button 
                    id="testMicBtn" 
                    class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                    aria-label="Test microphone">
                    🎤 Test Microphone
                </button>
                <button 
                    id="startRecordingBtn" 
                    class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500 transition font-semibold"
                    aria-label="Start recording">
                    ⏺️ Start Recording
                </button>
                <button 
                    id="stopRecordingBtn" 
                    class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500 transition font-semibold hidden"
                    aria-label="Stop recording">
                    ⏹️ Stop Recording
                </button>
            </div>
            <div id="recordingStatus" class="mt-4 hidden">
                <div class="flex items-center gap-3">
                    <div class="recording-indicator"></div>
                    <span class="text-red-600 font-semibold">Recording...</span>
                    <span id="recordingTimer" class="text-gray-600">0:00</span>
                </div>
                <div class="mt-2">
                    <div class="waveform-animation"></div>
                </div>
            </div>
        </section>

        <!-- Global Controls -->
        <section class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex flex-wrap gap-4">
                <button 
                    id="revealAllBtn" 
                    class="bg-yellow-600 hover:bg-yellow-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-500 transition"
                    aria-label="Toggle reveal all results">
                    👁️ Reveal/Hide All Results
                </button>
                <button 
                    id="exportBtn" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                    aria-label="Export attempts as JSON">
                    📥 Export JSON
                </button>
                <button 
                    id="clearAllBtn" 
                    class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500 transition"
                    aria-label="Clear all attempts">
                    🗑️ Clear All
                </button>
            </div>
        </section>

        <!-- Attempts List -->
        <section class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">Student Attempts</h2>
            <div id="attemptsList" class="space-y-4">
                <p class="text-gray-500 text-center py-8">No attempts recorded yet. Start recording to create attempts.</p>
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content max-w-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold">Settings</h2>
                <button 
                    id="closeSettingsBtn" 
                    class="text-gray-500 hover:text-gray-700 text-2xl focus:outline-none"
                    aria-label="Close settings">
                    ×
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label for="geminiApiKey" class="block text-sm font-medium text-gray-700 mb-1">
                        Gemini API Key *
                    </label>
                    <input 
                        type="password" 
                        id="geminiApiKey" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Enter your Gemini API key"
                        aria-required="true">
                    <p class="text-xs text-gray-500 mt-1">Get your API key from <a href="https://makersuite.google.com/app/apikey" target="_blank" class="text-blue-600 hover:underline">Google AI Studio</a></p>
                </div>
                <div>
                    <label for="teacherName" class="block text-sm font-medium text-gray-700 mb-1">
                        Teacher Name
                    </label>
                    <input 
                        type="text" 
                        id="teacherName" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Your name">
                </div>
                <button 
                    id="saveSettingsBtn" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition font-semibold">
                    Save Settings
                </button>
            </div>
        </div>
    </div>

    <!-- Attempt Name Modal -->
    <div id="attemptNameModal" class="modal hidden">
        <div class="modal-content max-w-md">
            <h2 class="text-2xl font-semibold mb-4">Name This Attempt</h2>
            <div class="space-y-4">
                <div>
                    <label for="attemptName" class="block text-sm font-medium text-gray-700 mb-1">
                        Attempt Name *
                    </label>
                    <input 
                        type="text" 
                        id="attemptName" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="e.g., Alice - Round 1"
                        aria-required="true">
                </div>
                <div class="flex gap-2">
                    <button 
                        id="saveAttemptNameBtn" 
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition font-semibold">
                        Save & Upload
                    </button>
                    <button 
                        id="cancelAttemptBtn" 
                        class="flex-1 bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500 transition">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
